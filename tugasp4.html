<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas P4 Wisata</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
    }

    header {
      text-align: center;
      padding: 15px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      margin: 5px;
      cursor: pointer;
      color: white;
    }

    .guest-btn { background: #3b82f6; }
    .admin-btn { background: #10b981; }

    .container {
      padding: 20px;
    }

    .filter {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* CARD */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
    }

    .card-body h3 {
      margin: 0;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #e5e7eb;
    }
  </style>
</head>
<body>

<header>
  <button class="guest-btn" onclick="showGuest()">Guest</button>
  <button class="admin-btn" onclick="showAdmin()">Admin</button>
</header>

<div class="container">

  <!-- FILTER -->
  <div class="filter">
    <input type="text" id="search" placeholder="Cari wisata..." onkeyup="render()">

    <select id="kategori" onchange="render()">
      <option value="">Semua Kategori</option>
      <option>Pantai</option>
      <option>Alam</option>
    </select>

    <select id="lokasi" onchange="render()">
      <option value="">Semua Lokasi</option>
      <option>Bali</option>
      <option>Jawa Timur</option>
      <option>Lombok</option>
      <option>Labuan Bajo</option>
      <option>Bangka Belitung</option>
    </select>
  </div>

  <!-- GUEST -->
  <div id="guestView" class="grid"></div>

  <!-- ADMIN -->
  <div id="adminView" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Kategori</th>
          <th>Lokasi</th>
          <th>Rating</th>
          <th>Harga</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
  const data = [
    {
      id: 1,
      nama: "Pantai Kuta",
      kategori: "Pantai",
      lokasi: "Bali",
      rating: 4.7,
      harga: 15000,
      gambar: "https://picsum.photos/400/300?1"
    },
    {
      id: 2,
      nama: "Gunung Bromo",
      kategori: "Alam",
      lokasi: "Jawa Timur",
      rating: 4.9,
      harga: 30000,
      gambar: "https://picsum.photos/400/300?2"
    }
  ];

  function showGuest() {
    document.getElementById("guestView").style.display = "grid";
    document.getElementById("adminView").style.display = "none";
  }

  function showAdmin() {
    document.getElementById("guestView").style.display = "none";
    document.getElementById("adminView").style.display = "block";
  }

  function render() {
    const search = document.getElementById("search").value.toLowerCase();
    const kategori = document.getElementById("kategori").value;
    const lokasi = document.getElementById("lokasi").value;

    const filtered = data.filter(item =>
      item.nama.toLowerCase().includes(search) &&
      (kategori ? item.kategori === kategori : true) &&
      (lokasi ? item.lokasi === lokasi : true)
    );

    // Guest View
    const guest = document.getElementById("guestView");
    guest.innerHTML = filtered.map(item => `
      <div class="card">
        <img src="${item.gambar}">
        <div class="card-body">
          <h3>${item.nama}</h3>
          <p>${item.lokasi}</p>
          <p>⭐ ${item.rating}</p>
          <p class="price">Rp ${item.harga}</p>
        </div>
      </div>
    `).join("");

    // Admin Table
    const table = document.getElementById("tableBody");
    table.innerHTML = filtered.map(item => `
      <tr>
        <td>${item.id}</td>
        <td>${item.nama}</td>
        <td>${item.kategori}</td>
        <td>${item.lokasi}</td>
        <td>${item.rating}</td>
        <td>Rp ${item.harga}</td>
      </tr>
    `).join("");
  }

  render();
</script>

</body>
</html>
